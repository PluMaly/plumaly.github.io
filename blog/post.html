  </head>
  <body>
    <a class="skip-link" href="#post-content">Skip to content</a>
    <div class="progress" id="progress-bar"></div>

    <header>
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav__inner">
          <a class="nav__brand" href="../index.html#home">Yue Yu</a>
          <button class="nav__toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
          </button>
          <ul class="nav__links" id="nav-links" role="menubar">
            <li role="none"><a class="nav__link" href="../index.html#home" role="menuitem">Home</a></li>
            <li role="none"><a class="nav__link" href="../index.html#publications" role="menuitem">Publications</a></li>
            <li role="none"><a class="nav__link nav__link--active" href="index.html" role="menuitem">Blog</a></li>

    <div class="nav-spacer"></div>

    <main class="container">

    <button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/scroll.js"></script>
    <script src="../assets/js/blog.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"]],
          displayMath: [["$$", "$$"]],
        },
        startup: {
          typeset: false,
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var filename = params.get("post");
        Blog.loadPost("post-content", filename).then(function () {
          if (window.MathJax && MathJax.typesetPromise) {
            return MathJax.typesetPromise();
          }
        }).catch(function (e) {
          console.warn("MathJax render:", e);
        });
      })();
    </script>
