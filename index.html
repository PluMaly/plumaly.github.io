<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yue Yu — Personal  Website</title>
    <meta name="description" content=" Yue Yu's Academic homepage" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/blog.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛</text></svg>" />
  </head>
  <body>
    <!-- Accessibility: skip to content -->
    <a class="skip-link" href="#home">Skip to content</a>

    <!-- Scroll progress bar -->
    <div class="progress" id="progress-bar"></div>

    <!-- Fixed navigation -->
    <header>
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav__inner">
          <a class="nav__brand" href="#home">Yue Yu</a>

          <button
            class="nav__toggle"
            id="nav-toggle"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
          >
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
          </button>

          <ul class="nav__links" id="nav-links" role="menubar">
            <li role="none"><a class="nav__link nav__link--active" href="#home" role="menuitem">Home</a></li>
            <li role="none"><a class="nav__link" href="#publications" role="menuitem">Publications</a></li>
            <li role="none"><a class="nav__link" href="#blog" role="menuitem">Blog</a></li>
            <li role="none"><a class="nav__link" href="#cv" role="menuitem">CV</a></li>
            <li role="none">
              <button class="nav__theme-btn" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="nav-spacer"></div>

    <main>
      <!-- ============================================= -->
      <!-- HOME SECTION                                   -->
      <!-- ============================================= -->
      <section class="section section--first" id="home" aria-labelledby="home-heading">
        <div class="container">
          <h2 class="sr-only" id="home-heading">About</h2>

          <div id="home-content"></div>
        </div>
      </section>

      <!-- ============================================= -->
      <!-- PUBLICATIONS SECTION                           -->
      <!-- ============================================= -->
      <section class="section" id="publications" aria-labelledby="pub-heading">
        <div class="container">
          <h2 class="section__title" id="pub-heading">Publications</h2>

          <!-- Filter tabs -->
          <div class="filter" role="tablist" aria-label="Filter publications by type">
            <button class="filter__btn filter__btn--active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button class="filter__btn" data-filter="journal" role="tab" aria-selected="false">Journal Papers</button>
            <button class="filter__btn" data-filter="conference" role="tab" aria-selected="false">Conference Papers</button>
            <button class="filter__btn" data-filter="working" role="tab" aria-selected="false">Working Papers</button>
          </div>

          <!-- Publication list (loaded from data/publications.json) -->
          <ul class="publication" id="publications-content" role="list"></ul>
        </div>
      </section>

      <!-- ============================================= -->
      <!-- BLOG SECTION                                   -->
      <!-- ============================================= -->
      <section class="section" id="blog" aria-labelledby="blog-heading">
        <div class="container">
          <h2 class="section__title" id="blog-heading">Blog</h2>
          <div id="blog-list"></div>
          <p style="margin-top:1rem">
            <a class="post__back" href="blog/index.html">View all posts →</a>
          </p>
        </div>
      </section>

      <!-- ============================================= -->
      <!-- CV SECTION                                     -->
      <!-- ============================================= -->
      <section class="section" id="cv" aria-labelledby="cv-heading">
        <div class="container">
          <h2 class="section__title" id="cv-heading">Curriculum Vitae</h2>

          <div id="cv-content"></div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <div class="container">
        <ul class="footer__links">
          <li><a class="footer__link" href="mailto:yue_yu_2004@163.com">Email</a></li>
          <li><a class="footer__link" href="https://github.com/PluMage" target="_blank" rel="noopener">GitHub</a></li>
          <li><a class="footer__link" href="#" target="_blank" rel="noopener">Google Scholar</a></li>
        </ul>
        <p class="footer__updated">Last updated: May 1, 2026</p>
      </div>
    </footer>

    <!-- Back to top -->
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

    <!-- JavaScript -->
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/scroll.js"></script>
    <script src="assets/js/filter.js"></script>
    <script src="assets/js/blog.js"></script>
    <script src="assets/js/content.js"></script>
    <script>
      Content.renderProfile("home-content");
      Content.renderPublications("publications-content");
      Content.renderCV("cv-content");
      Blog.loadBlogList("blog-list", "blog/");
    </script>
  </body>
</html>
